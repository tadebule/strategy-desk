name: Daily Strategy Feed Update

on:
  schedule:
    # Runs everyday at 6:00 AM UTC (Adjust cron if needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime via the GitHub UI

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add data_signals.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Fresh Strategy Signals" && git push)